[proxy]
listen_ip = 127.0.0.1
listen_port = 40445
; دامنه‌ای که برای تست DoH ها resolve می‌شود (doh_tester.py و تست اولیه‌ی برنامه).
; باید یک دامنه‌ی واقعی و دارای رکورد A باشد؛ می‌توانی دامنه‌ی خودت را بگذاری.
Domain = pages.dev

; هر تعداد DoH بخواهی با شماره‌ی جدید اضافه کن (DOH_04, DOH_05, ...).
; درخواست به همه همزمان می‌رود و اولین پاسخ موفق استفاده می‌شود.
; برای حذف یک مورد، خطش را پاک یا مقدارش را خالی بگذار؛ اگر همه خالی باشند DNS سیستم استفاده می‌شود.
DOH_01 = https://[2606:4700:4700::1001]/dns-query
DOH_02 = https://1.1.1.1/dns-query



; ثانیه؛ 0 = غیرفعال
idle_timeout = 300
connect_timeout = 10
handshake_timeout = 15
doh_timeout = 5
; سرور DoH ای که جواب نداد این‌قدر ثانیه کنار گذاشته می‌شود (هر بار شکست، دو برابر، تا حداکثر 300)
doh_cooldown = 30
; حداکثر انتظار برای DNS سیستم وقتی همه‌ی DoH ها شکست خوردند
system_dns_timeout = 5
; DEBUG / INFO / WARNING / ERROR
log_level = INFO


; برش وسط نام دامنه (SNI). اگر splitSNI = 1 باشد، lengths نادیده گرفته می‌شود
; (فقط وقتی SNI پیدا نشود lengths استفاده می‌شود).
[tlshello fragment]
packets = tlshello
lengths = 0,10,1
delay = 0 ms
maxSplit = 10
splitSNI = 1
Enable = 1


; lengths هم عدد ثابت می‌پذیرد و هم بازه‌ی تصادفی مثل 5-20
[1-1 fragment]
packets = 1-1
lengths = 10,1
delay = 1 ms
maxSplit = 10
splitSNI = 0
Enable = 0